[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mathematician-knowledge-analysis"
version = "2.2.0"
description = "数学人物知识分析：ReAct、混合检索与图谱增强"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "numpy>=1.26,<2.0",
    "rank-bm25>=0.2.2",
    "jieba>=0.42",
    "openai>=1.40",
    "networkx>=3.2",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pypdf>=5,<7",
    "psutil>=5.9,<8",
]

[project.optional-dependencies]
# 稠密检索与精排（本地模型，需磁盘放得下 ~400MB）
ml = ["sentence-transformers>=3.0", "torch>=2.1"]
# 生产依赖：向量库 / 缓存 / 队列 / 图库 / 可观测
prod = [
    "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1", "redis>=5,<7",
    "celery[redis]>=5.4,<6", "langgraph>=0.2,<2", "alembic>=1.13,<2",
]

dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "httpx>=0.27", "reportlab>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --no-header"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.coverage.run]
source = ["src/mathkb"]
