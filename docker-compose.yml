name: mathematician-knowledge-analysis

x-application: &application
  image: mathematician-knowledge-analysis:local
  build:
    context: .
    dockerfile: deploy/Dockerfile
  environment: &application-env
    MATHKB_ENV: prod
    MATHKB_LOG_JSON: "true"
    MATHKB_CREATE_SCHEMA: "false"
    MATHKB_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mathkb}:${POSTGRES_PASSWORD:-local-postgres-change-me}@postgres:5432/${POSTGRES_DB:-mathkb}
    MATHKB_DATA_DIR: /app/data/seed
    MATHKB_INDEX_DIR: /app/.index
    MATHKB_KEYWORD__PERSIST_DIR: /app/.index/bm25
    MATHKB_VECTOR__PROVIDER: pgvector
    MATHKB_VECTOR__COLLECTION: mathkb
    MATHKB_EMBEDDING__PROVIDER: ${MATHKB_EMBEDDING__PROVIDER:-hash}
    MATHKB_EMBEDDING__DIM: ${MATHKB_EMBEDDING__DIM:-512}
    MATHKB_EMBEDDING__CACHE_DIR: /app/models
    MATHKB_RERANK__ENABLED: ${MATHKB_RERANK__ENABLED:-false}
    MATHKB_QUEUE__PROVIDER: celery
    MATHKB_QUEUE__REDIS_URL: redis://redis:6379/0
    MATHKB_CACHE__ENABLED: "true"
    MATHKB_CACHE__REDIS_URL: redis://redis:6379/1
    MATHKB_CACHE__TTL_SECONDS: ${MATHKB_CACHE__TTL_SECONDS:-300}
    MATHKB_LLM__PROVIDER: ${MATHKB_LLM__PROVIDER:-stub}
    MATHKB_LLM__API_KEY: ${MATHKB_LLM__API_KEY:-}
    MATHKB_LLM__BASE_URL: ${MATHKB_LLM__BASE_URL:-https://api.deepseek.com/v1}
    MATHKB_LLM__MODEL: ${MATHKB_LLM__MODEL:-deepseek-chat}
    MATHKB_SERVER__API_TOKEN: ${MATHKB_SERVER__API_TOKEN:-local-demo-token-change-me}
    MATHKB_SERVER__CORS_ORIGINS: '["http://127.0.0.1:8080","http://localhost:8080"]'
  volumes:
    - index-data:/app/.index
    - uploads-data:/app/data/seed/uploads
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mathkb}
      POSTGRES_USER: ${POSTGRES_USER:-mathkb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *application
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn mathkb.main:app --app-dir src --host 0.0.0.0 --port 8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *application
    command: ["celery", "-A", "mathkb.worker:celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  index-data:
  uploads-data:
