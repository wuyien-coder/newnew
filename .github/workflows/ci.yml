name: validate-project

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-backend:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      MATHKB_LLM__PROVIDER: stub
      MATHKB_LLM__API_KEY: ""
      MATHKB_EMBEDDING__PROVIDER: hash
      MATHKB_VECTOR__PROVIDER: memory
      MATHKB_QUEUE__PROVIDER: local
      MATHKB_CACHE__ENABLED: "false"
      MATHKB_SERVER__API_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev,prod]"
      - run: python -m pytest -q
      - run: python scripts/smoke_test.py
      - run: python scripts/check_stack.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build api
